<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SentinelLayer — Enrichment Explorer</title><style>:root{color-scheme:dark;--bg:#090b10;--p:#11151c;--l:#252b35;--t:#edf1f7;--m:#8f9aaa;--a:#8ec5ff;--g:#7ddc9a;--w:#f1c75b;--b:#ef7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1250px;margin:auto;padding:24px 18px 60px}header{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}h1{margin:0 0 5px;font-size:27px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--m)}.card{background:var(--p);border:1px solid var(--l);border-radius:11px;padding:15px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.value{font-size:27px;font-weight:700;margin-top:5px}.label{color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.explore{display:grid;grid-template-columns:310px 1fr;gap:14px}.search{width:100%;padding:10px;border:1px solid var(--l);border-radius:7px;background:#0b0e13;color:var(--t)}.list{height:700px;overflow:auto;border:1px solid var(--l);border-radius:7px;margin-top:8px}.item{display:block;width:100%;padding:10px;border:0;border-bottom:1px solid var(--l);background:transparent;color:var(--t);text-align:left;cursor:pointer}.item:hover,.item.active{background:#1a2029}.item b{display:block}.item small{display:block;color:var(--m);margin-top:3px}.detail-title{font-size:22px;font-weight:700}.links a,.record a{color:var(--a);margin-right:12px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kv{border:1px solid var(--l);border-radius:7px;padding:9px}.kv small{display:block;color:var(--m);text-transform:uppercase;font-size:9px}.kv div{margin-top:4px;word-break:break-word}.record{border:1px solid var(--l);border-radius:7px;padding:10px;margin:7px 0}.record pre{white-space:pre-wrap;word-break:break-word;background:#0b0e13;border-radius:6px;padding:8px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px}.pill{border:1px solid var(--l);border-radius:99px;padding:3px 7px;font-size:10px}.good{color:var(--g)}.warn{color:var(--w)}.bad{color:var(--b)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.explore{grid-template-columns:1fr}.list{height:260px}.facts{grid-template-columns:1fr 1fr}}@media(max-width:520px){.facts{grid-template-columns:1fr}header{display:block}.updated{margin-top:8px}}
</style></head><body><main><header><div><h1>SentinelLayer — Enrichment Explorer</h1><div class="muted">Select a completed company to inspect its persisted enrichment record.</div></div><div class="muted" id="updated">Loading…</div></header><section class="grid"><div class="card"><div class="label">Source companies</div><div class="value" id="companies">—</div></div><div class="card"><div class="label">Enriched</div><div class="value" id="enriched">—</div></div><div class="card"><div class="label">Coverage</div><div class="value" id="coverage">—</div></div><div class="card"><div class="label">Scored</div><div class="value" id="scored">—</div></div></section><section class="card"><h2>Company explorer</h2><div class="explore"><div><input id="search" class="search" placeholder="Search company or domain…"><div id="list" class="list"></div></div><div id="detail"><div class="muted">Select a company.</div></div></div></section></main><script>
let D;
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const fmt=v=>v==null?'—':new Intl.NumberFormat().format(v);const date=v=>v?new Date(v).toLocaleString():'—';const pretty=v=>esc(JSON.stringify(v,null,2));
function list(){const q=document.getElementById('search').value.trim().toLowerCase();const a=Object.entries(D.company_details).filter(([_,x])=>`${x.company.name} ${x.company.domain}`.toLowerCase().includes(q)).sort((a,b)=>a[1].company.name.localeCompare(b[1].company.name));document.getElementById('list').innerHTML=a.length?a.map(([id,x])=>`<button class="item" data-id="${id}"><b>${esc(x.company.name)}</b><small>${esc(x.company.domain)} · ${x.evidence.length} evidence · ${x.decision_makers.length} DMs · ${x.intent_signals.length} intent</small></button>`).join(''):'<div class="muted" style="padding:12px">No matching enriched company.</div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
function detail(id){const d=D.company_details[id],c=d.company,f=d.facts||{},s=d.score||{};document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===String(id)));let h=`<div class="row"><div><div class="detail-title">${esc(c.name)}</div><div class="muted">${esc(c.domain)}</div><div class="links">${c.website?`<a href="${esc(c.website)}" target="_blank" rel="noopener">Website</a>`:''}${c.company_linkedin?`<a href="${esc(c.company_linkedin)}" target="_blank" rel="noopener">Company LinkedIn</a>`:''}</div></div><span class="pill">ID ${esc(c.id)}</span></div>`;h+=`<div class="facts">${[['Segment',c.segment],['Country',c.country],['City',c.city],['Revenue estimate',c.revenue_est],['Visits estimate',c.visits_est],['MX status',c.mx_status],['Mail provider',c.mail_provider],['Catch-all risk',c.catchall_risk],['Source',c.source],['Facts updated',f.updated_at]].map(x=>`<div class="kv"><small>${esc(x[0])}</small><div>${esc(x[1])}</div></div>`).join('')}</div>`;if(c.notes)h+=`<div class="record"><b>Notes</b><div style="margin-top:6px">${esc(c.notes)}</div></div>`;h+=`<h3>Company facts</h3><div class="record"><pre>${pretty(f)}</pre></div><h3>Score</h3><div class="record"><pre>${pretty(s)}</pre></div>`;h+=`<h3>Decision makers (${d.decision_makers.length})</h3>`+(d.decision_makers.length?d.decision_makers.map(x=>`<div class="record"><div class="row"><div><b>${esc(x.full_name)}</b><div class="muted">${esc(x.title)} · ${esc(x.role_family)}</div></div><span class="pill">${esc(x.status||'unknown')}</span></div><div style="margin-top:6px">Priority: ${esc(x.role_priority)} · Confidence: ${x.confidence==null?'—':(x.confidence*100).toFixed(0)+'%'}<br>${esc(x.rationale||'')}<br>Research: ${esc(x.research_status||'—')} · Last verified: ${date(x.last_verified_at)}</div>${x.contact_methods.length?`<div class="muted" style="margin-top:6px">Contact methods: ${x.contact_methods.map(cm=>`${esc(cm.channel)} — ${esc(cm.verification_status||'unknown')} (${esc(cm.source||'unknown')})`).join(' · ')}</div>`:''}</div>`).join(''):'<div class="muted">No decision-maker records persisted.</div>';h+=`<h3>Evidence (${d.evidence.length})</h3>`+(d.evidence.length?d.evidence.map(x=>`<div class="record"><div class="row"><b>${esc(x.claim_type||'claim')}</b><span>${x.confidence==null?'—':(x.confidence*100).toFixed(0)+'%'}</span></div><pre>${pretty(x.claim)}</pre><div class="muted">Observed: ${date(x.observed_at)} · Event: ${esc(x.event_date||'—')} · Type: ${esc(x.source_type||'—')}</div>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener">Open source</a>`:''}</div>`).join(''):'<div class="muted">No evidence records persisted.</div>';h+=`<h3>Buying intent (${d.intent_signals.length})</h3>`+(d.intent_signals.length?d.intent_signals.map(x=>`<div class="record"><div class="row"><b>${esc(x.signal_type)}</b><span>${x.confidence==null?'—':(x.confidence*100).toFixed(0)+'%'}</span></div><div style="margin-top:6px">Signal date: ${esc(x.signal_date||'—')} · Detected: ${date(x.detected_at)}<br>Weight: ${esc(x.weight)} · Half-life: ${esc(x.half_life_days)} days · Status: ${esc(x.status)}<br>Evidence: ${x.evidence_id?esc(x.evidence_id):'<span class="warn">not linked</span>'}</div></div>`).join(''):'<div class="muted">No intent signals persisted.</div>';h+=`<h3>Enrichment runs (${d.runs.length})</h3>`+(d.runs.length?d.runs.map(x=>`<div class="record"><div class="row"><b>${esc(x.run_type)} · ${esc(x.provider)}</b><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div style="margin-top:6px">Agent: ${esc(x.model_or_agent||'—')}<br>Started: ${date(x.started_at)} · Completed: ${date(x.completed_at)}${x.error_code?`<br><span class="bad">Error: ${esc(x.error_code)}</span>`:''}</div></div>`).join(''):'<div class="muted">No enrichment runs persisted.</div>';document.getElementById('detail').innerHTML=h}
async function load(){try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();const m=D.metrics;document.getElementById('updated').textContent='Snapshot: '+date(D.generated_at);document.getElementById('companies').textContent=fmt(m.companies);document.getElementById('enriched').textContent=fmt(m.enriched_companies);document.getElementById('coverage').textContent=(m.companies?m.enriched_companies/m.companies*100:0).toFixed(1)+'%';document.getElementById('scored').textContent=fmt(m.scored_companies);document.getElementById('search').oninput=list;list();}catch(e){document.getElementById('updated').textContent='Unable to load dashboard snapshot'}}load();
</script></body></html>

events {}

http {
    limit_req_zone $binary_remote_addr zone=test_per_source:1m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=test_per_source_conn:1m;

    log_format operational '$time_iso8601 request_id=$request_id remote=$remote_addr '
                           'method=$request_method status=$status bytes=$body_bytes_sent '
                           'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /tmp/nginx-access.log operational;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 32k;
        client_header_timeout 2s;
        client_body_timeout 2s;
        send_timeout 2s;
        keepalive_timeout 5s;

        location = /healthz {
            proxy_pass http://upstream:8081/healthz;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location = /readyz {
            proxy_pass http://upstream:8081/readyz;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location ^~ /t/ {
            limit_req zone=test_per_source burst=10 nodelay;
            proxy_pass http://upstream:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_send_timeout 1s;
        }

        location ^~ /c/ {
            limit_conn test_per_source_conn 32;
            proxy_pass http://upstream:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 1s;
        }

        location / {
            return 404;
        }
    }
}

events {}

http {
    limit_req_zone $binary_remote_addr zone=tracking_per_source:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=tracking_per_source_conn:10m;

    log_format operational '$time_iso8601 request=$request_id remote=$remote_addr '
                           'status=$status bytes=$body_bytes_sent '
                           'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log operational;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 32k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 15s;

        location = /healthz {
            proxy_pass http://tracking:8080/healthz;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /readyz {
            proxy_pass http://tracking:8080/readyz;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location ^~ /t/ {
            limit_req zone=tracking_per_source burst=10 nodelay;
            limit_conn tracking_per_source_conn 32;

            proxy_pass http://tracking:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location / {
            return 404;
        }
    }
}
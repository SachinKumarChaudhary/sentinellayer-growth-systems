name: Phase 2 Live Canary

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SL_DATABASE_URL: ${{ secrets.SL_DATABASE_URL || secrets.SUPABASE_DATABASE_URL }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY || secrets.SL_TINYFISH_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run 4-lead Phase 2 canary
        run: |
          set -euo pipefail
          python scripts/run_phase2_entity_resolution.py             --request-key phase2-live-canary-4-20260928-r1             --limit 4             --candidate-budget 25             --max-search-results 5             --max-fetch-urls 3

      - name: Replay the same request key
        run: |
          set -euo pipefail
          python scripts/run_phase2_entity_resolution.py             --request-key phase2-live-canary-4-20260928-r1             --limit 4             --candidate-budget 25             --max-search-results 5             --max-fetch-urls 3

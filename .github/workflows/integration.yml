name: integration

on:
  push:
    branches: [main]

jobs:
  supabase-concurrency:
    runs-on: ubuntu-latest
    steps:
      - name: Require database credential
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          test -n "$SUPABASE_DATABASE_URL" || {
            echo "Missing required GitHub Actions secret: SUPABASE_DATABASE_URL"
            exit 1
          }
          echo "::add-mask::$SUPABASE_DATABASE_URL"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Validate PostgreSQL connection safely
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import psycopg

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          parsed = urlsplit(dsn)
          params = dict(q.split("=", 1) for q in parsed.query.split("&") if "=" in q)
          sslmode = params.get("sslmode", "driver-default")
          safe = f"{parsed.scheme}://{parsed.username}:REDACTED@{parsed.hostname}:{parsed.port or 5432}{parsed.path}?sslmode={sslmode}"
          print(f"Safe connection identity: user={parsed.username}, host={parsed.hostname}, port={parsed.port or 5432}, database={parsed.path.lstrip('/')}, sslmode={sslmode}")
          print(f"Connection target: {safe}")

          try:
              # Supabase recommends SSL for Session Pooler connections.
              with psycopg.connect(dsn, connect_timeout=15, sslmode="require") as conn:
                  with conn.cursor() as cur:
                      cur.execute("select 1")
                      assert cur.fetchone() == (1,)
              print("PostgreSQL authentication and query: OK")
          except Exception as exc:
              # Never print the exception verbatim: database drivers may include
              # connection details. Expose only a safe diagnostic classification.
              error_type = type(exc).__name__
              message = str(exc)
              lowered = message.lower()
              if "password authentication failed" in lowered:
                  reason = "authentication_failed"
              elif "network is unreachable" in lowered:
                  reason = "network_unreachable"
              elif "connection refused" in lowered:
                  reason = "connection_refused"
              elif "timed out" in lowered or "timeout" in lowered:
                  reason = "connection_timeout"
              elif "ssl" in lowered or "tls" in lowered:
                  reason = "tls_or_ssl_error"
              else:
                  reason = "postgresql_connection_error"
              print(f"PostgreSQL connection failed: type={error_type}, reason={reason}")
              raise SystemExit(1)
          PY
      - name: Supabase concurrency integration test
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: pytest -q tests/integration/test_supabase_concurrency.py -m integration

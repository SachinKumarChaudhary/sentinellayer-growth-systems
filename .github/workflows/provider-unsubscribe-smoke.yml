name: provider-unsubscribe-smoke

on:
  workflow_dispatch:
    inputs:
      process_reply:
        description: "Process the controlled unsubscribe reply through Conversation safety"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: provider-unsubscribe-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging-mail
    env:
      SL_REAL_EMAIL_ENABLED: "false"
      IMAP_HOST: ${{ secrets.SL_IMAP_HOST }}
      IMAP_PORT: ${{ secrets.SL_IMAP_PORT }}
      IMAP_USERNAME: ${{ secrets.SL_IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.SL_IMAP_PASSWORD }}
      IMAP_MAILBOX: ${{ secrets.SL_IMAP_MAILBOX }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate required configuration
        if: ${{ inputs.process_reply }}
        run: |
          set -euo pipefail
          for name in IMAP_HOST IMAP_PORT IMAP_USERNAME IMAP_PASSWORD IMAP_MAILBOX SUPABASE_DATABASE_URL; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          test "$IMAP_PORT" = "993" || { echo "IMAP must use TLS port 993"; exit 1; }
          test "$SL_REAL_EMAIL_ENABLED" = "false" || { echo "Real email must remain disabled"; exit 1; }
      - name: Install
        if: ${{ inputs.process_reply }}
        run: python -m pip install -e .
      - name: Process unsubscribe through Conversation safety
        if: ${{ inputs.process_reply }}
        run: |
          python - <<'PY'
          import imaplib
          import os
          import time
          from uuid import uuid4

          import psycopg
          from psycopg.rows import dict_row

          from sentinellayer_growth_engine.conversation_runtime import ConversationRuntime
          from sentinellayer_growth_engine.conversation_sales import ConversationSalesBridge
          from sentinellayer_growth_engine.db import Database
          from sentinellayer_growth_engine.imap_inbound import parse_message

          THREAD_MARKER = "sentinellayer-provider-smoke"
          ACCOUNT_ID = "staging-provider-smoke"
          DEADLINE_SECONDS = 120

          def find_unsubscribe(client):
              status, data = client.uid("SEARCH", None, "SUBJECT", '"Sentinel Layer staging smoke test"')
              if status != "OK":
                  raise RuntimeError("IMAP subject search failed")
              for uid_bytes in reversed((data[0] or b"").split()):
                  uid = uid_bytes.decode("ascii", errors="strict")
                  status, fetched = client.uid("FETCH", uid, "(RFC822)")
                  if status != "OK":
                      continue
                  raw = next((item[1] for item in fetched if isinstance(item, tuple) and len(item) == 2), None)
                  if not isinstance(raw, bytes):
                      continue
                  message = parse_message(uid, raw)
                  if message.subject.lower().startswith("re:") and THREAD_MARKER in message.thread_key:
                      if "unsubscribe" in message.body_text.lower():
                          return message
              return None

          deadline = time.monotonic() + DEADLINE_SECONDS
          message = None
          while time.monotonic() < deadline:
              client = imaplib.IMAP4_SSL(os.environ["IMAP_HOST"], int(os.environ["IMAP_PORT"]), timeout=15)
              try:
                  client.login(os.environ["IMAP_USERNAME"], os.environ["IMAP_PASSWORD"])
                  status, _ = client.select(os.environ["IMAP_MAILBOX"], readonly=True)
                  if status != "OK":
                      raise RuntimeError("IMAP mailbox selection failed")
                  message = find_unsubscribe(client)
                  if message is not None:
                      break
              finally:
                  try:
                      client.logout()
                  except OSError:
                      pass
              time.sleep(10)

          if message is None:
              raise SystemExit("Timed out waiting for the controlled unsubscribe reply")

          print("Controlled unsubscribe reply parsed: OK")
          print(f"Inbound subject: {message.subject}")
          print(f"Thread key: {message.thread_key}")
          print(f"Provider message id: {message.provider_message_id}")
          print("Inbound sender: [redacted]")

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("select id from public.people where lower(trim(email))=%s order by id limit 1", (message.sender_email,))
              row = cur.fetchone()
              if row is None:
                  raise SystemExit("Controlled unsubscribe sender does not have a staging person identity")
              person_id = int(row["id"])

              cur.execute("select conversation_id, person_id from conversation.threads where thread_key=%s", (message.thread_key,))
              thread = cur.fetchone()
              if thread is None or str(thread["person_id"]) != str(person_id):
                  raise SystemExit("Controlled unsubscribe thread identity mismatch")
              conversation_id = str(thread["conversation_id"])

          db = Database(dsn, worker_id="provider-unsubscribe-smoke")
          identity = db.resolve_inbound_identity(sender_email=message.sender_email, thread_key=message.thread_key)
          if identity != (ACCOUNT_ID, str(person_id)):
              raise SystemExit(f"Unexpected inbound identity: {identity!r}")
          print("Inbound identity resolution: OK")

          runtime = ConversationRuntime(db, sales_bridge=ConversationSalesBridge(db))
          outcome = runtime.handle_inbound(
              account_id=ACCOUNT_ID,
              person_id=str(person_id),
              sender_email=message.sender_email,
              subject=message.subject,
              body_text=message.body_text,
              provider_message_id=message.provider_message_id,
              thread_key=message.thread_key,
              source_send_id=message.source_send_id,
          )
          classification = outcome["handoff"]["classification"]
          if classification != "unsubscribe":
              raise SystemExit(f"Expected unsubscribe classification, got {classification!r}")
          if not outcome["stop_sequence"]:
              raise SystemExit("Unsubscribe did not activate stop sequence")
          if outcome["sales"] is not None:
              raise SystemExit("Unsubscribe unexpectedly created a Sales task")
          if outcome["persisted"].get("status") not in {"stored", "duplicate"}:
              raise SystemExit("Conversation persistence did not report stored/duplicate")
          print("Conversation classification: unsubscribe")
          print(f"Conversation persistence: {outcome['persisted']['status']}")
          print("Sales handoff: none")
          print("Stop sequence: activated")

          duplicate = runtime.handle_inbound(
              account_id=ACCOUNT_ID,
              person_id=str(person_id),
              sender_email=message.sender_email,
              subject=message.subject,
              body_text=message.body_text,
              provider_message_id=message.provider_message_id,
              thread_key=message.thread_key,
              source_send_id=message.source_send_id,
          )
          if duplicate["persisted"].get("status") != "duplicate":
              raise SystemExit("Duplicate unsubscribe processing was not idempotent")
          if duplicate["sales"] is not None:
              raise SystemExit("Duplicate unsubscribe unexpectedly created a Sales task")
          print("Duplicate unsubscribe processing: idempotent")

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  select r.classification, r.provider_message_id, t.state
                  from conversation.replies r
                  join conversation.threads t on t.conversation_id=r.conversation_id
                  where r.provider_message_id=%s
                  """,
                  (message.provider_message_id,),
              )
              persisted = cur.fetchone()
              if persisted is None or persisted["classification"] != "unsubscribe":
                  raise SystemExit("Durable unsubscribe reply was not persisted")

              cur.execute(
                  "select email, reason from public.suppression where lower(trim(email))=%s",
                  (message.sender_email.lower().strip(),),
              )
              suppression = cur.fetchone()
              if suppression is None or suppression["reason"] != "inbound_unsubscribe":
                  raise SystemExit("Permanent unsubscribe suppression was not persisted")

              cur.execute(
                  """
                  select status, count(*) as count
                  from public.sends
                  where person_id=%s
                  group by status
                  order by status
                  """,
                  (person_id,),
              )
              send_statuses = cur.fetchall()

          active_statuses = [row for row in send_statuses if row["status"] not in {"sent", "failed", "cancelled"}]
          if active_statuses:
              raise SystemExit(f"Future sends remain after unsubscribe: {active_statuses!r}")

          print("Durable Conversation persistence: VERIFIED")
          print(f"Persisted classification: {persisted['classification']}")
          print(f"Conversation thread state: {persisted['state']}")
          print("Permanent suppression: VERIFIED")
          print("Future sends cancelled: VERIFIED")

          client = imaplib.IMAP4_SSL(os.environ["IMAP_HOST"], int(os.environ["IMAP_PORT"]), timeout=15)
          try:
              client.login(os.environ["IMAP_USERNAME"], os.environ["IMAP_PASSWORD"])
              status, _ = client.select(os.environ["IMAP_MAILBOX"], readonly=False)
              if status != "OK":
                  raise SystemExit("IMAP mailbox selection for final Seen update failed")
              status, _ = client.uid("STORE", message.uid, "+FLAGS", "(\\Seen)")
              if status != "OK":
                  raise SystemExit("Failed to mark controlled unsubscribe reply Seen")
          finally:
              try:
                  client.logout()
              except OSError:
                  pass
          print("Mailbox acknowledgement: Seen after successful safety runtime")
          PY

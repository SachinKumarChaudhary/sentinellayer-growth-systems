name: n8n version memory benchmark

on:
  push:
    branches:
      - ops/n8n-version-memory-benchmark
    paths:
      - ".github/workflows/n8n-version-memory-benchmark.yml"
      - "benchmarks/n8n-memory/**"

permissions:
  contents: read

jobs:
  compare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Compare exact n8n images under a 512 MiB memory cap
        run: bash benchmarks/n8n-memory/run.sh

      - name: Upload benchmark report and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-memory-benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

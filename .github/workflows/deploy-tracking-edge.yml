name: deploy-tracking-edge

on:
  workflow_dispatch:
    inputs:
      tracking_origin:
        description: Public origin that serves /t/<token>
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRACKING_ORIGIN: ${{ inputs.tracking_origin }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate Cloudflare secrets are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker
        working-directory: ops/cloudflare
        run: |
          printf '%s\n' "name = \"sentinellayer-tracking-edge\"" \
            "main = \"tracking-worker.js\"" \
            "compatibility_date = \"2026-09-13\"" \
            > wrangler.ci.toml
          printf '%s\n' "[vars]" "TRACKING_ORIGIN = \"$TRACKING_ORIGIN\"" \
            >> wrangler.ci.toml
          wrangler deploy --config wrangler.ci.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"

name: Phase 2 Production Canary

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  phase2-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SL_DATABASE_URL: ${{ secrets.SL_DATABASE_URL || secrets.SUPABASE_DATABASE_URL }}
      SL_TINYFISH_API_KEY: ${{ secrets.SL_TINYFISH_API_KEY }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SL_ENVIRONMENT: development
      SL_REAL_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=83,<84"
          python -m pip install -e ".[dev]"

      - name: Run 4-lead Phase 2 canary
        run: |
          set -euo pipefail
          test -n "${SL_DATABASE_URL:-}" || { echo "Missing SL_DATABASE_URL/SUPABASE_DATABASE_URL"; exit 2; }
          test -n "${SL_TINYFISH_API_KEY:-${TINYFISH_API_KEY:-}}" || { echo "Missing TinyFish API key"; exit 2; }
          test -n "${GROQ_API_KEY:-}" || { echo "Missing GROQ_API_KEY"; exit 2; }

          python scripts/run_phase2_entity_resolution.py             --request-key phase2-live-canary-4-20260929-r1             --limit 4             --candidate-budget 25             --max-search-results 5             --max-fetch-urls 3

      - name: Verify persisted canary
        run: |
          python - <<'PY'
          import os
          import psycopg

          conn = psycopg.connect(os.environ["SL_DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("""
                SELECT status, input_count, decision_count, match_count,
                       research_required_count, provider_error_count
                FROM growth.entity_resolution_runs
                WHERE request_key = %s
              """, ("phase2-live-canary-4-20260929-r1",))
              row = cur.fetchone()
              if row is None:
                  raise SystemExit("Canary run was not persisted")
              print("run=", row)
              status, inputs, decisions, matches, research_required, provider_errors = row
              if status != "COMPLETED":
                  raise SystemExit(f"Unexpected run status: {status}")
              if inputs != 4 or decisions != 4:
                  raise SystemExit(f"Expected 4 inputs/decisions, got {inputs}/{decisions}")
              if provider_errors:
                  raise SystemExit(f"Provider errors: {provider_errors}")
          conn.close()
          PY

      - name: Replay same request key
        run: |
          set -euo pipefail
          python scripts/run_phase2_entity_resolution.py             --request-key phase2-live-canary-4-20260929-r1             --limit 4             --candidate-budget 25             --max-search-results 5             --max-fetch-urls 3

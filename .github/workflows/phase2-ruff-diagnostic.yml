name: phase2-ruff-diagnostic

on:
  push:
    branches:
      - ci/phase2-post-pilot-validation-2

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ruff diagnostic
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff check             src/sentinellayer_growth_engine/phase2/tinyfish_provider.py             tests/test_phase2_tinyfish_provider.py             --output-format=concise || true

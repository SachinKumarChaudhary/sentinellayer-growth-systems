name: enrichment-dashboard

on:
  schedule:
    - cron: "45 21 * * *"
  workflow_run:
    workflows: ["tinyfish-enrichment-daily"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/generate_enrichment_dashboard.py"
      - ".github/workflows/enrichment-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: enrichment-dashboard
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository
        run: |
          python -m pip install --upgrade pip 'setuptools>=83,<84'
          python -m pip install -e .

      - name: Validate dashboard data source
        run: test -n "$SUPABASE_DATABASE_URL"

      - name: Generate live dashboard snapshot
        run: python scripts/generate_enrichment_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

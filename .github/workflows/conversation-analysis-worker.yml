name: Conversation Analysis Worker

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum analysis jobs to process"
        required: false
        default: "10"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analysis-worker.trigger"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: staging-mail
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      BATCH_SIZE: ${{ inputs.batch_size || '10' }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_DATABASE_URL" || { echo "Missing required GitHub Actions secret: SUPABASE_DATABASE_URL"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "Missing required GitHub Actions secret: GROQ_API_KEY"; exit 1; }
          echo "::add-mask::$SUPABASE_DATABASE_URL"
          echo "::add-mask::$GROQ_API_KEY"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Apply Supabase migrations
        run: python scripts/apply_supabase_migrations.py

      - name: Process analysis queue
        run: |
          python - <<'PY'
          import os

          import psycopg
          from psycopg.rows import dict_row

          from sentinellayer_growth_engine.conversation_analysis_queue import (
              ConversationAnalysisQueue,
              ConversationAnalysisWorker,
          )
          from sentinellayer_growth_engine.conversation_analyzer import GroqAnalyzer

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          api_key = os.environ["GROQ_API_KEY"]
          batch_size = int(os.environ.get("BATCH_SIZE", "10"))
          if batch_size < 1 or batch_size > 100:
              raise SystemExit("BATCH_SIZE must be between 1 and 100")

          worker_id = f"github-actions-{os.environ.get('GITHUB_RUN_ID', 'manual')}"
          queue = ConversationAnalysisQueue(dsn, worker_id=worker_id)
          analyzer = GroqAnalyzer(api_key=api_key, model=os.environ.get("GROQ_MODEL", "openai/gpt-oss-20b"))

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  select analysis_id
                  from conversation.analysis_jobs
                  where status='pending'
                     or (status='processing' and lease_until < now())
                  order by created_at
                  limit %s
                  """,
                  (batch_size,),
              )
              target_ids = [str(row["analysis_id"]) for row in cur.fetchall()]

          print(f"Analysis jobs selected for verification: {len(target_ids)}")
          for analysis_id in target_ids:
              print(f"Target analysis id: {analysis_id}")

          processed = ConversationAnalysisWorker(queue, analyzer).run_once(batch_size=batch_size)
          print(f"Conversation analysis jobs processed: {processed}")

          if processed != len(target_ids):
              raise SystemExit(
                  f"Worker processed {processed} jobs but {len(target_ids)} jobs were selected; "
                  "queue state changed unexpectedly"
              )

          if not target_ids:
              print("Analysis queue empty: nothing to process")
              raise SystemExit(0)

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute(
                  """
                  select analysis_id, status, provider, model, error
                  from conversation.analysis_jobs
                  where analysis_id = any(%s::uuid[])
                  order by created_at
                  """,
                  (target_ids,),
              )
              rows = cur.fetchall()

          observed = {str(row["analysis_id"]): row for row in rows}
          missing = [analysis_id for analysis_id in target_ids if analysis_id not in observed]
          if missing:
              raise SystemExit(f"Analysis jobs disappeared after worker run: {missing}")

          failed = [
              (analysis_id, observed[analysis_id]["status"], observed[analysis_id]["error"])
              for analysis_id in target_ids
              if observed[analysis_id]["status"] != "completed"
          ]
          if failed:
              raise SystemExit(f"Analysis worker did not complete all selected jobs: {failed}")

          for analysis_id in target_ids:
              row = observed[analysis_id]
              if row["provider"] != "groq":
                  raise SystemExit(f"Unexpected provider for {analysis_id}: {row['provider']!r}")
              if row["model"] != os.environ.get("GROQ_MODEL", "openai/gpt-oss-20b"):
                  raise SystemExit(f"Unexpected model for {analysis_id}: {row['model']!r}")

          print("Durable analysis completion: VERIFIED")
          print("Provider/model metadata: VERIFIED")
          PY

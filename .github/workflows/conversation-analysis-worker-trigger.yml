name: Conversation Analysis Worker Trigger

on:
  push:
    paths:
      - ".github/analysis-worker-trigger.txt"

permissions:
  contents: read

jobs:
  analyze:
    if: startsWith(github.event.head_commit.message, 'RUN-CONVERSATION-ANALYSIS')
    runs-on: ubuntu-latest
    environment: staging-mail
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      BATCH_SIZE: "10"
    steps:
      - name: Validate Groq authorization
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.groq.com/openai/v1/models)"
          echo "Groq models endpoint HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            echo "Groq authorization response:"
            python - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          try:
              data=json.loads(p.read_text())
              if isinstance(data, dict) and isinstance(data.get("error"), dict):
                  print(json.dumps({"error": data["error"]}, sort_keys=True))
              else:
                  print("Groq returned an error without a standard error object")
          except Exception:
              print("Groq returned a non-JSON error response")
          PY
            exit 1
          fi
          echo "Groq authorization: OK"
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DATABASE_URL" || { echo "Missing required GitHub Actions secret: SUPABASE_DATABASE_URL"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "Missing required GitHub Actions secret: GROQ_API_KEY"; exit 1; }
          echo "::add-mask::$SUPABASE_DATABASE_URL"
          echo "::add-mask::$GROQ_API_KEY"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Apply Supabase migrations
        run: python scripts/apply_supabase_migrations.py
      - name: Diagnose Groq chat completion
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-20b","messages":[{"role":"user","content":"Reply with the word OK."}],"temperature":0,"max_tokens":8}' \
            https://api.groq.com/openai/v1/chat/completions)"
          echo "Groq minimal chat completion HTTP status: $status"
          python - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          try:
              data = json.loads(p.read_text())
              if isinstance(data, dict) and isinstance(data.get("error"), dict):
                  error = data["error"]
                  print(json.dumps({"error": {
                      "type": error.get("type"),
                      "code": error.get("code"),
                      "message": str(error.get("message", ""))[:500],
                  }}, sort_keys=True))
              elif isinstance(data, dict):
                  print(json.dumps({"choices_present": bool(data.get("choices"))}, sort_keys=True))
              else:
                  print("Groq returned a non-object response")
          except Exception:
              print("Groq returned a non-JSON response")
          PY
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
      - name: Process analysis queue
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row
          from sentinellayer_growth_engine.conversation_analysis_queue import ConversationAnalysisQueue, ConversationAnalysisWorker
          from sentinellayer_growth_engine.conversation_analyzer import GroqAnalyzer

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          api_key = os.environ["GROQ_API_KEY"]
          batch_size = int(os.environ["BATCH_SIZE"])
          worker_id = f"github-actions-{os.environ.get('GITHUB_RUN_ID', 'manual')}"
          queue = ConversationAnalysisQueue(dsn, worker_id=worker_id)
          analyzer = GroqAnalyzer(api_key=api_key, model=os.environ["GROQ_MODEL"])

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("""
                  select analysis_id from conversation.analysis_jobs
                  where status='pending' or (status='processing' and lease_until < now())
                  order by created_at limit %s
              """, (batch_size,))
              target_ids = [str(r["analysis_id"]) for r in cur.fetchall()]
          print(f"Analysis jobs selected for verification: {len(target_ids)}")
          for analysis_id in target_ids:
              print(f"Target analysis id: {analysis_id}")

          processed = ConversationAnalysisWorker(queue, analyzer).run_once(batch_size=batch_size)
          print(f"Conversation analysis jobs processed: {processed}")
          if processed != len(target_ids):
              raise SystemExit(f"Worker processed {processed} jobs but {len(target_ids)} were selected")
          if not target_ids:
              raise SystemExit("Analysis queue empty: expected at least one pending job")

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("""
                  select analysis_id, status, provider, model, analysis
                  from conversation.analysis_jobs
                  where analysis_id = any(%s::uuid[])
                  order by created_at
              """, (target_ids,))
              rows = cur.fetchall()
          observed = {str(r["analysis_id"]): r for r in rows}
          if set(observed) != set(target_ids):
              raise SystemExit("Analysis job set changed unexpectedly")
          for analysis_id in target_ids:
              row = observed[analysis_id]
              if row["status"] != "completed":
                  raise SystemExit(f"{analysis_id} not completed: {row['status']!r}, error={row.get('error')!r}")
              if row["provider"] != "groq":
                  raise SystemExit(f"{analysis_id} unexpected provider: {row['provider']!r}")
              if row["model"] != os.environ["GROQ_MODEL"]:
                  raise SystemExit(f"{analysis_id} unexpected model: {row['model']!r}")
              if not isinstance(row["analysis"], dict):
                  raise SystemExit(f"{analysis_id} analysis is not structured JSON")
              print(f"Completed analysis: {analysis_id}")
              print(f"Analysis keys: {sorted(row['analysis'].keys())}")
          print("Durable analysis completion: VERIFIED")
          PY
name: provider-unsubscribe-analysis-smoke

on:
  workflow_dispatch:
    inputs:
      process_reply:
        description: "Process the controlled unsubscribe reply and enqueue semantic analysis"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: staging-mail
    env:
      SL_REAL_EMAIL_ENABLED: "false"
      IMAP_HOST: ${{ secrets.SL_IMAP_HOST }}
      IMAP_PORT: ${{ secrets.SL_IMAP_PORT }}
      IMAP_USERNAME: ${{ secrets.SL_IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.SL_IMAP_PASSWORD }}
      IMAP_MAILBOX: ${{ secrets.SL_IMAP_MAILBOX }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate required configuration
        if: ${{ inputs.process_reply }}
        run: |
          set -euo pipefail
          for name in IMAP_HOST IMAP_PORT IMAP_USERNAME IMAP_PASSWORD IMAP_MAILBOX SUPABASE_DATABASE_URL; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          test "$IMAP_PORT" = "993" || { echo "IMAP must use TLS port 993"; exit 1; }
          test "$SL_REAL_EMAIL_ENABLED" = "false" || { echo "Real email must remain disabled"; exit 1; }
      - name: Install
        if: ${{ inputs.process_reply }}
        run: python -m pip install -e .
      - name: Enqueue unsubscribe analysis safely
        if: ${{ inputs.process_reply }}
        run: |
          python - <<'PY'
          import imaplib
          import os
          import time

          import psycopg
          from psycopg.rows import dict_row

          from sentinellayer_growth_engine.conversation_analysis_queue import ConversationAnalysisQueue
          from sentinellayer_growth_engine.conversation_runtime import ConversationRuntime
          from sentinellayer_growth_engine.conversation_sales import ConversationSalesBridge
          from sentinellayer_growth_engine.db import Database
          from sentinellayer_growth_engine.imap_inbound import parse_message

          ACCOUNT_ID = "staging-provider-smoke"
          MARKER = "sentinellayer-provider-smoke"

          def find_reply(client):
              status, data = client.uid("SEARCH", None, "SUBJECT", '"Sentinel Layer staging smoke test"')
              if status != "OK":
                  raise RuntimeError("IMAP subject search failed")
              for uid_bytes in reversed((data[0] or b"").split()[-50:]):
                  uid = uid_bytes.decode("ascii")
                  status, fetched = client.uid("FETCH", uid, "(RFC822)")
                  if status != "OK":
                      continue
                  raw = next((x[1] for x in fetched if isinstance(x, tuple) and len(x) == 2), None)
                  if not isinstance(raw, bytes):
                      continue
                  message = parse_message(uid, raw)
                  if message.subject.lower().startswith("re:") and MARKER in message.thread_key and "unsubscribe" in message.body_text.lower():
                      return message
              return None

          deadline = time.monotonic() + 120
          message = None
          while time.monotonic() < deadline and message is None:
              client = imaplib.IMAP4_SSL(os.environ["IMAP_HOST"], int(os.environ["IMAP_PORT"]), timeout=15)
              try:
                  client.login(os.environ["IMAP_USERNAME"], os.environ["IMAP_PASSWORD"])
                  status, _ = client.select(os.environ["IMAP_MAILBOX"], readonly=True)
                  if status != "OK":
                      raise RuntimeError("IMAP mailbox selection failed")
                  message = find_reply(client)
              finally:
                  try:
                      client.logout()
                  except OSError:
                      pass
              if message is None:
                  time.sleep(10)

          if message is None:
              raise SystemExit("Timed out waiting for the controlled unsubscribe reply")
          print(f"Controlled unsubscribe reply: {message.subject}")

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("select id from public.people where lower(trim(email))=%s order by id limit 1", (message.sender_email,))
              person = cur.fetchone()
              if person is None:
                  raise SystemExit("Controlled sender has no staging person")
              person_id = str(person["id"])
              cur.execute("select conversation_id, person_id from conversation.threads where thread_key=%s", (message.thread_key,))
              thread = cur.fetchone()
              if thread is None or str(thread["person_id"]) != person_id:
                  raise SystemExit("Controlled thread identity mismatch")

          db = Database(dsn, worker_id="provider-unsubscribe-analysis-smoke")
          if db.resolve_inbound_identity(sender_email=message.sender_email, thread_key=message.thread_key) != (ACCOUNT_ID, person_id):
              raise SystemExit("Inbound identity resolution failed")

          queue = ConversationAnalysisQueue(dsn, worker_id=f"provider-unsubscribe-analysis-{os.environ.get('GITHUB_RUN_ID', 'manual')}")
          runtime = ConversationRuntime(db, sales_bridge=ConversationSalesBridge(db), analysis_queue=queue)
          outcome = runtime.handle_inbound(
              account_id=ACCOUNT_ID,
              person_id=person_id,
              sender_email=message.sender_email,
              subject=message.subject,
              body_text=message.body_text,
              provider_message_id=message.provider_message_id,
              thread_key=message.thread_key,
              source_send_id=message.source_send_id,
          )

          if outcome["handoff"]["classification"] != "unsubscribe":
              raise SystemExit(f"Expected unsubscribe, got {outcome['handoff']['classification']!r}")
          if outcome["sales"] is not None:
              raise SystemExit("Unsubscribe reply incorrectly created a Sales task")
          if outcome.get("analysis_enqueued") is not True or outcome.get("analysis_enqueue_error") is not None:
              raise SystemExit(f"Analysis queue failure: {outcome.get('analysis_enqueue_error')!r}")
          if not db.is_suppressed(message.sender_email):
              raise SystemExit("Unsubscribe suppression is not durable")

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("select analysis_id, status, provider, model from conversation.analysis_jobs where reply_id=%s order by created_at desc limit 1", (outcome["persisted"]["reply_id"],))
              analysis = cur.fetchone()
              if analysis is None or analysis["status"] != "pending":
                  raise SystemExit(f"Expected pending analysis job, got {analysis!r}")

          print("Deterministic safety: unsubscribe")
          print("Sales handoff: suppressed")
          print("Durable suppression: VERIFIED")
          print("Conversation analysis: PENDING")
          print(f"Analysis job id: {analysis['analysis_id']}")
          print("Invariant: semantic analysis may enrich this reply, but cannot override suppression")
          PY

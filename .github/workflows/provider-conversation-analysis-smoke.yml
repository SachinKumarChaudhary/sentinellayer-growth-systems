name: provider-conversation-analysis-smoke
run-name: provider-conversation-analysis-smoke / ${{ github.ref_name }} / ${{ github.sha }}

# Push trigger is intentional: staging smoke must exercise the current main commit.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      process_reply:
        description: "Process the next fresh controlled provider reply"
        required: true
        default: false
        type: boolean

jobs:
  smoke:
    if: ${{ inputs.process_reply || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      SL_REAL_EMAIL_ENABLED: "false"
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify checkout provenance
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected workflow SHA: $GITHUB_SHA"
          echo "Checked-out SHA:       $actual"
          test "$actual" = "$GITHUB_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in IMAP_HOST IMAP_PORT IMAP_USERNAME IMAP_PASSWORD IMAP_MAILBOX SUPABASE_DATABASE_URL; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          test "$IMAP_PORT" = "993"
          test "$SL_REAL_EMAIL_ENABLED" = "false"
      - name: Install
        run: python -m pip install -e .
      - name: Discover fresh reply, process it, and enqueue analysis
        run: |
          python - <<'PY'
          import imaplib
          import os
          import time
          import psycopg
          from psycopg.rows import dict_row
          from sentinellayer_growth_engine.conversation_analysis_queue import ConversationAnalysisQueue
          from sentinellayer_growth_engine.conversation_runtime import ConversationRuntime
          from sentinellayer_growth_engine.conversation_sales import ConversationSalesBridge
          from sentinellayer_growth_engine.db import Database
          from sentinellayer_growth_engine.imap_inbound import parse_message

          ACCOUNT_ID = "staging-provider-smoke"
          MARKER = "sentinellayer-provider-smoke"
          SUBJECT = '"Sentinel Layer staging smoke test"'

          def discover_fresh_reply(client, dsn):
              status, data = client.uid("SEARCH", None, "SUBJECT", SUBJECT)
              if status != "OK":
                  raise RuntimeError("IMAP subject search failed")
              candidates = []
              for uid_bytes in reversed((data[0] or b"").split()[-50:]):
                  uid = uid_bytes.decode("ascii", errors="strict")
                  status, fetched = client.uid("FETCH", uid, "(RFC822)")
                  if status != "OK":
                      continue
                  raw = next((item[1] for item in fetched if isinstance(item, tuple) and len(item) == 2), None)
                  if not isinstance(raw, bytes):
                      continue
                  message = parse_message(uid, raw)
                  if not message.subject.lower().startswith("re:") or MARKER not in message.thread_key:
                      continue
                  candidates.append(message)
              if not candidates:
                  return None
              with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
                  for message in candidates:
                      cur.execute("select reply_id from conversation.replies where provider_message_id=%s", (message.provider_message_id,))
                      if cur.fetchone() is None:
                          return message
              return None

          dsn = os.environ["SUPABASE_DATABASE_URL"]
          deadline = time.monotonic() + 120
          message = None
          while time.monotonic() < deadline and message is None:
              client = imaplib.IMAP4_SSL(os.environ["IMAP_HOST"], int(os.environ["IMAP_PORT"]), timeout=15)
              try:
                  client.login(os.environ["IMAP_USERNAME"], os.environ["IMAP_PASSWORD"])
                  status, _ = client.select(os.environ["IMAP_MAILBOX"], readonly=True)
                  if status != "OK":
                      raise RuntimeError("IMAP mailbox selection failed")
                  message = discover_fresh_reply(client, dsn)
              finally:
                  try: client.logout()
                  except OSError: pass
              if message is None:
                  time.sleep(10)
          if message is None:
              raise SystemExit("Timed out waiting for a fresh controlled inbound reply")

          print("Fresh controlled inbound reply discovered automatically")
          print(f"Inbound subject: {message.subject}")
          print(f"Thread key: {message.thread_key}")
          print(f"Provider message id: {message.provider_message_id}")
          print("Inbound sender: [redacted]")

          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("select id from public.people where lower(trim(email))=%s order by id limit 1", (message.sender_email,))
              row = cur.fetchone()
              if row is None:
                  raise SystemExit("Controlled sender does not have a staging person identity")
              person_id = int(row["id"])
              cur.execute("select conversation_id, person_id from conversation.threads where thread_key=%s", (message.thread_key,))
              thread = cur.fetchone()
              if thread is None or str(thread["person_id"]) != str(person_id):
                  raise SystemExit("Controlled inbound thread identity mismatch")
              cur.execute("select reply_id from conversation.replies where provider_message_id=%s", (message.provider_message_id,))
              if cur.fetchone() is not None:
                  raise SystemExit("Fresh-reply invariant failed before runtime: discovered provider Message-ID is already persisted")

          db = Database(dsn, worker_id=f"provider-conversation-analysis-smoke-{os.environ.get('GITHUB_RUN_ID', 'manual')}")
          identity = db.resolve_inbound_identity(sender_email=message.sender_email, thread_key=message.thread_key)
          if identity != (ACCOUNT_ID, str(person_id)):
              raise SystemExit(f"Unexpected inbound identity: {identity!r}")
          print("Inbound identity resolution: OK")
          analysis_queue = ConversationAnalysisQueue(dsn, worker_id=f"provider-conversation-analysis-smoke-{os.environ.get('GITHUB_RUN_ID', 'manual')}")
          runtime = ConversationRuntime(db, sales_bridge=ConversationSalesBridge(db), analysis_queue=analysis_queue)
          outcome = runtime.handle_inbound(account_id=ACCOUNT_ID, person_id=str(person_id), sender_email=message.sender_email, subject=message.subject, body_text=message.body_text, provider_message_id=message.provider_message_id, thread_key=message.thread_key, source_send_id=message.source_send_id)
          if outcome["persisted"].get("status") != "stored":
              raise SystemExit(f"Fresh-reply invariant failed: {outcome['persisted'].get('status')!r}")
          if outcome.get("analysis_enqueued") is not True or outcome.get("analysis_enqueue_error") is not None:
              raise SystemExit(f"Analysis enqueue failed: {outcome.get('analysis_enqueue_error')!r}")
          print(f"Conversation classification: {outcome['handoff']['classification']}")
          print("Conversation persistence: stored")
          print("Analysis enqueue: OK")
          with psycopg.connect(dsn, sslmode="require", row_factory=dict_row) as conn, conn.cursor() as cur:
              cur.execute("select r.reply_id, r.classification, j.analysis_id, j.status from conversation.replies r join conversation.analysis_jobs j on j.reply_id=r.reply_id where r.provider_message_id=%s order by j.created_at desc limit 1", (message.provider_message_id,))
              job = cur.fetchone()
              if job is None:
                  raise SystemExit("No durable analysis job exists for the fresh reply")
              if job["status"] != "pending":
                  raise SystemExit(f"Expected pending analysis job, got {job['status']!r}")
          print("Durable analysis job: VERIFIED")
          print(f"Analysis id: {job['analysis_id']}")
          print(f"Analysis status: {job['status']}")
          duplicate = runtime.handle_inbound(account_id=ACCOUNT_ID, person_id=str(person_id), sender_email=message.sender_email, subject=message.subject, body_text=message.body_text, provider_message_id=message.provider_message_id, thread_key=message.thread_key, source_send_id=message.source_send_id)
          if duplicate["persisted"].get("status") != "duplicate":
              raise SystemExit("Duplicate inbound processing was not idempotent")
          print("Duplicate inbound processing: idempotent")
          client = imaplib.IMAP4_SSL(os.environ["IMAP_HOST"], int(os.environ["IMAP_PORT"]), timeout=15)
          try:
              client.login(os.environ["IMAP_USERNAME"], os.environ["IMAP_PASSWORD"])
              status, _ = client.select(os.environ["IMAP_MAILBOX"], readonly=False)
              if status != "OK":
                  raise SystemExit("IMAP mailbox selection for final Seen update failed")
              status, _ = client.uid("STORE", message.uid, "+FLAGS", "(\\Seen)")
              if status != "OK":
                  raise SystemExit("Failed to mark controlled reply Seen")
          finally:
              try: client.logout()
              except OSError: pass
          print("Mailbox acknowledgement: Seen after successful runtime + queue verification")
          PY